<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="카페 온도 심벌">
  <!-- 카페 온도 (CAFE ONDO) 심벌 — 컵 + 온도 눈금 (감정 온도 게이지 서사와 연결)
       브랜드 가이드: docs/plan/b2b/brand-cafe-ondo.md
       컬러: 딥 브라운 #4A2E1F / 웜 오렌지 #E8833A / 크림 #F7EFE6 -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="#4A2E1F"/>
  <!-- 스팀 -->
  <path d="M47 36c-4-5-4-9 0-14" fill="none" stroke="#E8833A" stroke-width="5" stroke-linecap="round"/>
  <path d="M63 36c-4-5-4-9 0-14" fill="none" stroke="#E8833A" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <!-- 컵 손잡이 -->
  <path d="M78 52a11 11 0 0 1 0 22" fill="none" stroke="#F7EFE6" stroke-width="7" stroke-linecap="round"/>
  <!-- 컵 몸통 -->
  <path d="M32 44h48v26a12 12 0 0 1-12 12H44a12 12 0 0 1-12-12z" fill="#F7EFE6"/>
  <!-- 온도계: 기둥 + 수은주 + 눈금 -->
  <line x1="50" y1="52" x2="50" y2="67" stroke="#E8833A" stroke-width="6" stroke-linecap="round"/>
  <circle cx="50" cy="72" r="6.5" fill="#E8833A"/>
  <line x1="61" y1="53" x2="66" y2="53" stroke="#4A2E1F" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="61" y1="60" x2="68" y2="60" stroke="#4A2E1F" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <line x1="61" y1="67" x2="66" y2="67" stroke="#4A2E1F" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <!-- 소서 -->
  <line x1="30" y1="90" x2="82" y2="90" stroke="#F7EFE6" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</svg>
